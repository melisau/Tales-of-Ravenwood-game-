  <path d="M742 578h52l470 446H272Z" fill="#0a0910" opacity=".88"/>
  <g stroke="#95847c" stroke-width="5" fill="url(#stone)">
    <path d="M726 585h84v22h-84z"/><path d="M715 608h106v23H715z"/><path d="M702 633h132v25H702z"/>
    <path d="M687 660h162v27H687z"/><path d="M667 689h202v28H667z"/><path d="M645 719h246v30H645z"/>
    <path d="M618 751h300v31H618z"/><path d="M584 784h368v33H584z"/><path d="M544 819h448v36H544z"/>
    <path d="M496 857h544v38H496z"/><path d="M438 897h660v40H438z"/><path d="M370 939h796v42H370z"/>
