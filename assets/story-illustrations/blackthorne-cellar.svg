  <g fill="#b8a797" opacity=".22"><circle cx="322" cy="846" r="3"/><circle cx="378" cy="901" r="2"/><circle cx="1090" cy="846" r="3"/><circle cx="1356" cy="869" r="2"/><circle cx="758" cy="880" r="2"/></g>
