<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Blackthorne Konağı'nın unutulmuş mahzeni</title>
  <desc id="desc">On üç taş basamaklı kapanmış mutfak kapağının altındaki mahzen; zincirli demir kapı, eğilen fener alevleri, kaybolan çocuk ayak izleri ve bir damla su.</desc>
  <defs>
    <linearGradient id="room" x2=".18" y2="1"><stop stop-color="#171322"/><stop offset=".48" stop-color="#292031"/><stop offset="1" stop-color="#09090f"/></linearGradient>
    <linearGradient id="stone" x2="0" y2="1"><stop stop-color="#827477"/><stop offset=".36" stop-color="#51484f"/><stop offset="1" stop-color="#211c25"/></linearGradient>
    <linearGradient id="door" x2="1" y2=".5"><stop stop-color="#15151d"/><stop offset=".48" stop-color="#39323a"/><stop offset="1" stop-color="#17151d"/></linearGradient>
    <linearGradient id="amber" x2="0" y2="1"><stop stop-color="#fff2be"/><stop offset=".35" stop-color="#e6af59"/><stop offset="1" stop-color="#9d5030"/></linearGradient>
    <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#241e26"/><stop offset=".6" stop-color="#17151c"/><stop offset="1" stop-color="#09090f"/></linearGradient>
    <radialGradient id="lanternGlow"><stop stop-color="#dca65e" stop-opacity=".48"/><stop offset="1" stop-color="#dca65e" stop-opacity="0"/></radialGradient>
    <radialGradient id="damp"><stop stop-color="#596e76" stop-opacity=".42"/><stop offset="1" stop-color="#151820" stop-opacity="0"/></radialGradient>
    <pattern id="grain" width="67" height="54" patternUnits="userSpaceOnUse"><circle cx="8" cy="10" r="1.4" fill="#e9d9bb" opacity=".13"/><circle cx="46" cy="26" r="1" fill="#d5b88f" opacity=".1"/><path d="M20 46l8-2" stroke="#e9d9bb" opacity=".08"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="27"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="1536" height="1024" fill="url(#room)"/>
  <ellipse cx="779" cy="548" rx="470" ry="400" fill="#a65b3d" opacity=".17" filter="url(#soft)"/>
  <ellipse cx="404" cy="520" rx="240" ry="245" fill="url(#lanternGlow)"/>
  <ellipse cx="1190" cy="476" rx="265" ry="270" fill="url(#lanternGlow)" opacity=".7"/>

