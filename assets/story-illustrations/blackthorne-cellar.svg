  <!-- lanterns sway, every flame bent by the same unseen breath -->
  <g>
    <g transform="translate(375 351) rotate(-9)"><path d="M-25 0h50l-5 79h-40zM-28 0h56m-50 12h44m-44 55h44M-14-1v-22q14-19 28 0v22" fill="#18161c" stroke="#b39169" stroke-width="5"/><path d="M7 59q-18-14 1-39 4 17 15 22 1 16-16 17Z" fill="url(#amber)"/><path d="M9 52q-6-12 1-19 8 12 7 17" fill="#fff1c1"/></g>
